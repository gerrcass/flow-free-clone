<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link
      rel="preload"
      href="./fonts/baloo-2-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Pipe Trails display face (#15, ADR 0006): Baloo 2 (SIL OFL 1.1)
       * variable latin subset, self-hosted in public/fonts and preloaded
       * above. Inline here (not index.css) so the URL stays
       * document-relative: correct at root and subpath hosting, in dev
       * and in dist. Headings and the wordmark use it via --heading;
       * body and HUD stay on the system stack. No runtime CDN fetch. */
      @font-face {
        font-family: 'Pipe Trails Display';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('./fonts/baloo-2-latin.woff2') format('woff2');
      }
    </style>
    <meta name="theme-color" content="#1c1e26" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pipe Trails — Free Play pipe puzzle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
